# ============================================================================
# Zamorin Cafe ERP — Demo (AWS EC2 single-box, all-AWS)
# Backend image is pulled from ECR. Mongo/Redis/Caddy use standard images.
# Deploy: docker compose pull backend && docker compose up -d --no-deps backend
# ============================================================================
services:
  mongodb:
    image: mongo:7.0
    container_name: zamorin-mongodb
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: zamorin_cafe_erp
    entrypoint: [ "/bin/sh", "-c", "mongod --replSet rs0 --bind_ip_all & MONGOD_PID=$$!; until mongosh --eval 'rs.status().ok || rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"127.0.0.1:27017\"}]})' >/dev/null 2>&1; do sleep 1; done; echo 'MongoDB Replica Set rs0 initialized'; wait $$MONGOD_PID" ]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\").ok' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zamorin-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # Image pulled from ECR. Tag is injected by deploy script or CI.
    image: ${ECR_REGISTRY:-000000000000.dkr.ecr.ap-south-1.amazonaws.com}/zamorin-demo:${IMAGE_TAG:-latest}
    container_name: zamorin-backend-api
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: caddy:2-alpine
    container_name: zamorin-frontend-ui
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/srv/frontend:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
  redis_data:
  caddy_data:
  caddy_config:
