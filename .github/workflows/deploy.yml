name: Deploy Demo (tag-triggered)

on:
  push:
    tags:
      - 'v*-demo'
      - 'v*.*.*-demo'

env:
  AWS_REGION: ap-south-1

jobs:
  deploy:
    name: Deploy via SSM (local build on instance)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        env:
          IMAGE_TAG: ${{ github.ref_name }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"cd /home/ubuntu/zamorin-demo && git pull\",
              \"docker compose up -d --build backend\",
              \"sleep 30 && curl -sf http://localhost:4000/health/ready && echo HEALTH_OK || echo HEALTH_FAILED\"
            ]" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" --output text)

          echo "Deploy command: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "StandardOutputContent" --output text

      - name: Post deploy URL
        run: |
          echo "=== Deploy complete ==="
          echo "Demo URL: https://<elastic-ip-with-dashes>.sslip.io"
